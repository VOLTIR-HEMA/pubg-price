<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cafe - Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        .status-available { background-color: #22c55e; } /* green-500 */
        .status-busy { background-color: #f97316; }      /* orange-500 */
        .status-open-time { background-color: #3b82f6; } /* blue-500 */
        .status-locked { background-color: #ef4444; }    /* red-500 */
        .status-offline { background-color: #6b7280; }   /* gray-500 */
        .status-online { background-color: #16a34a; }    /* green-600 */
        .status-disconnected { background-color: #dc2626; } /* red-600 */
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div class="container mx-auto p-4 md:p-6">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold">🎮 Cyber Cafe Master Dashboard</h1>
            <div class="flex justify-center items-center gap-2 mt-2">
                <p class="text-gray-400">Firebase Connection:</p>
                <span id="connection-status" class="px-3 py-1 text-sm font-semibold rounded-full status-disconnected">DISCONNECTED</span>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="mb-6 p-4 bg-gray-800 rounded-lg shadow-md flex flex-wrap gap-3 justify-center">
            <button onclick="app.sendGlobalCommand('LOCK_AVAILABLE')" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded transition-colors"><i class="fas fa-lock mr-2"></i>🔒 قفل المتاحين</button>
            <button onclick="app.sendGlobalCommand('UNLOCK_ALL')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition-colors"><i class="fas fa-unlock-alt mr-2"></i>🔓 فتح الجميع</button>
            <button onclick="app.sendGlobalCommand('SHUTDOWN_ALL')" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-4 rounded transition-colors"><i class="fas fa-power-off mr-2"></i>⚡ إغلاق الجميع</button>
            <button onclick="app.openSettingsModal()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition-colors"><i class="fas fa-cogs mr-2"></i>⚙️ الإعدادات</button>
        </div>

        <!-- PC Grid -->
        <div id="pc-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
            <!-- PC Cards will be dynamically injected here -->
        </div>
    </div>

    <!-- Control PC Modal -->
    <div id="control-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md relative">
            <button onclick="app.closeControlModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-2xl">&times;</button>
            <h2 id="modal-pc-id" class="text-2xl font-bold mb-6">Control PC-XX</h2>

            <!-- Actions -->
            <div class="space-y-4">
                <div>
                    <label class="block mb-2">Add Fixed Time (Minutes)</label>
                    <div class="flex">
                        <input type="number" id="modal-add-time-input" class="bg-gray-700 text-white border border-gray-600 rounded-l px-3 py-2 w-full" placeholder="e.g., 60">
                        <button onclick="app.addFixedTime()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r">Add</button>
                    </div>
                </div>
                
                <button onclick="app.openUnlimitedSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">⏱️ وقت مفتوح (Open Session)</button>
                <button onclick="app.forceLock()" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-4 rounded">🔒 قفل إجباري (Force Lock)</button>

                <div>
                    <label class="block mb-2">Broadcast Alert to this PC</label>
                    <div class="flex">
                        <input type="text" id="modal-broadcast-input" class="bg-gray-700 text-white border border-gray-600 rounded-l px-3 py-2 w-full" placeholder="Your message...">
                        <button onclick="app.sendBroadcast()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-r">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-lg relative">
            <button onclick="app.closeSettingsModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-2xl">&times;</button>
            <h2 class="text-2xl font-bold mb-6">Global Settings</h2>

            <!-- Daily Unlock PIN -->
            <div class="mb-6">
                <label class="block mb-2 font-semibold">Daily Unlock PIN</label>
                <p class="text-sm text-gray-400 mb-2">PIN used by the agent to automatically unlock screens.</p>
                <div class="flex">
                    <input type="password" id="daily-pin-input" class="bg-gray-700 text-white border border-gray-600 rounded-l px-3 py-2 w-full" placeholder="Enter new PIN">
                    <button onclick="app.saveDailyPin()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r">Save PIN</button>
                </div>
            </div>

            <!-- Change Windows System Password -->
            <div>
                <label class="block mb-2 font-semibold">Change All Windows Passwords</label>
                <p class="text-sm text-gray-400 mb-2">WARNING: This changes the actual Windows user password on all online PCs.</p>
                <div class="flex">
                    <input type="password" id="windows-password-input" class="bg-gray-700 text-white border border-gray-600 rounded-l px-3 py-2 w-full" placeholder="Enter new system password">
                    <button onclick="app.changeAllWindowsPasswords()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-r">Change All</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import App from './app.js';

        const firebaseConfig = {
          apiKey: "AIzaSyATZxYMCcgj2Soxfuh-GWLlZu7LFNWeDSk", // Replace with your actual config
          authDomain: "caffe-2003.firebaseapp.com",
          databaseURL: "https://caffe-2003-default-rtdb.firebaseio.com",
          projectId: "caffe-2003",
          storageBucket: "caffe-2003.appspot.com",
          messagingSenderId: "904443853862",
          appId: "1:904443853862:web:bc8328b07144ecbe41bae7"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const database = getDatabase(firebaseApp);
        
        window.app = new App(database, { ref, onValue, update, get });
        window.app.init();
    </script>
</body>
</html>
